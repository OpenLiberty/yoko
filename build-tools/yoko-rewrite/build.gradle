// Custom OpenRewrite recipes for Yoko source style.
// This is an included build (see the root settings.gradle) so that it is not
// subject to the configuration applied to the production subprojects.
plugins {
    id 'java-library'
}

group = 'io.openliberty.yoko.build'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

// Must match the rewrite engine version used by the org.openrewrite.rewrite
// Gradle plugin declared in the root build.gradle (plugin 6.25.0 -> engine 8.37.0).
        def rewriteVersion = '8.37.0'

dependencies {
    api "org.openrewrite:rewrite-java:${rewriteVersion}"
    runtimeOnly "org.openrewrite:rewrite-java-17:${rewriteVersion}"

    testImplementation "org.openrewrite:rewrite-test:${rewriteVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    testRuntimeOnly "org.openrewrite:rewrite-java-17:${rewriteVersion}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
