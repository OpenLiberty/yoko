dependencies {
  compileOnly 'org.osgi:org.osgi.service.component.annotations:1.4.0'

  // depend on the Yoko spec classes
  implementation project(':yoko-osgi')
  implementation files(project(':yoko-osgi').sourceSets.main.output)
  implementation project(':yoko-spec-corba')
  implementation files(project(':yoko-spec-corba').sourceSets.main.output)
  implementation project(':yoko-rmi-spec')
  implementation files(project(':yoko-rmi-spec').sourceSets.main.output)

  // and the rest of the Yoko implementation
  implementation project(":yoko-util")
  implementation files(project(":yoko-util").sourceSets.main.output)
  implementation project(":yoko-rmi-impl")
  implementation files(project(":yoko-rmi-impl").sourceSets.main.output)
}

// The core-bundle embeds all subproject JARs, so they must NOT appear as
// transitive Maven dependencies. Override the shared pom.withXml block that
// the root build applies to all published projects.
plugins.withId('maven-publish') {
    publishing {
        publications {
            maven(MavenPublication) {
                pom.withXml {
                    // Remove any dependency nodes written by the shared configure block
                    def root = asNode()
                    def depsNode = root.dependencies
                    if (depsNode) root.remove(depsNode[0])

                    // Declare only the OSGi API as a provided/runtime dependency
                    // so consumers of the bundle know the OSGi framework is required
                    def deps = root.appendNode('dependencies')
                    def dep = deps.appendNode('dependency')
                    dep.appendNode('groupId', 'org.osgi')
                    dep.appendNode('artifactId', 'org.osgi.core')
                    dep.appendNode('version', '6.0.0')
                    dep.appendNode('scope', 'provided')
                }
            }
        }
    }
}