sourceSets {
  test.java.srcDir "src/test/java-testify"
}

//testClasses.dependsOn v0Classes, v1Classes, v2Classes

// describe the versioned projects in their own configurations
configurations {
	v0 { transitive false }
	v1 { transitive false }
	v2 { transitive false }
}


dependencies {
  testImplementation project(':yoko-spec-corba')
  testImplementation project(':yoko-rmi-spec')
  testImplementation project(':yoko-rmi-impl')
  testImplementation project(':yoko-core')
  testImplementation project(':yoko-util')
  testImplementation project(":testify")
  testImplementation project(":testify-iiop")
  testImplementation project("artifact")
  testImplementation "org.junit.jupiter:junit-jupiter:5.9.0"
  
  v0 project("artifact:v0")
  v1 project("artifact:v1")
  v2 project("artifact:v2")
  
}

// Shared setup closure applied to both test tasks
def sharedTestConfig = { t ->
  t.testClassesDirs = sourceSets.test.output.classesDirs
  t.classpath = sourceSets.test.runtimeClasspath
  t.dependsOn configurations.v0
  t.dependsOn configurations.v1
  t.dependsOn configurations.v2
  t.systemProperty "acme.loader.v0.path", "" + configurations.v0.singleFile
  t.systemProperty "acme.loader.v1.path", "" + configurations.v0.singleFile + File.pathSeparator + configurations.v1.singleFile
  t.systemProperty "acme.loader.v2.path", "" + configurations.v0.singleFile + File.pathSeparator + configurations.v2.singleFile
}

// testConcurrentHashMap must be registered before `test` so that `test` can depend on it.
//
// This task runs:
//   - ConcurrentHashMapMarshalTest (except testClientMarshalFailsWithoutAddOpens)
//   - ConcurrentHashMapServerMarshalFailTest
// Both need java.util.concurrent opened on the client so that the RMI stubs can be
// set up correctly; the server-fail test restricts the *server* JVM instead.
// testClientMarshalFailsWithoutAddOpens deliberately asserts the absence of
// --add-opens on the client and therefore must stay in the plain `test` task below.
tasks.register('testConcurrentHashMap', Test) {
  description = 'Runs ConcurrentHashMap tests with --add-opens java.base/java.util.concurrent on the client JVM'
  group = 'verification'

  sharedTestConfig(it)
  useJUnitPlatform()

  include '**/ConcurrentHashMapMarshalTest*'
  include '**/ConcurrentHashMapServerMarshalFailTest*'
  filter {
    excludeTestsMatching '*ConcurrentHashMapMarshalTest.testClientMarshalFailsWithoutAddOpens'
  }

  // Open java.util.concurrent on the client so that RMI stubs and unmarshalling work
  jvmArgs '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED'
  jvmArgs '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED'
  jvmArgs '--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED'
}

test {
  exclude '**/Abstract*'

  // ConcurrentHashMapMarshalTest runs in testConcurrentHashMap (above) because that task opens
  // java.util.concurrent on the client JVM.  The one exception is testClientMarshalFailsWithoutAddOpens,
  // which must run here where java.util.concurrent is NOT opened.
  exclude '**/testServerWithAddOpensCanMarshal*'
  // ConcurrentHashMapServerMarshalFailTest also runs in testConcurrentHashMap (client needs the open)
  exclude '**/ConcurrentHashMapServerMarshalFailTest*'

  // When a --tests filter is supplied that only matches tests that run in testConcurrentHashMap
  // (e.g. --tests "*ConcurrentHashMapServerMarshalFailTest.*"), the test task itself will find
  // nothing. Avoid a build failure in that case.
  filter.failOnNoMatchingTests = false

  // Propagate any --tests filter supplied by the user to the sibling task so that e.g.
  //   ./gradlew :yoko-verify:test --tests "*ConcurrentHashMapMarshalTest.*"
  // runs the matching tests in both tasks.
  doFirst {
    def userFilter = test.filter.commandLineIncludePatterns
    if (!userFilter.isEmpty()) {
      testConcurrentHashMap.filter.setCommandLineIncludePatterns(userFilter)
    }
  }

  // Running `test` always runs testConcurrentHashMap too, so that
  //   ./gradlew :yoko-verify:test
  // covers the full test suite.
  dependsOn testConcurrentHashMap

  sharedTestConfig(it)
}

// Also run testConcurrentHashMap as part of the standard `check` lifecycle
check.dependsOn testConcurrentHashMap

