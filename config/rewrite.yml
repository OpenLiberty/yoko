type: specs.openrewrite.org/v1beta/recipe
name: yoko.format.All
displayName: Yoko source formatting
description: >
  The one transformation that modernises the code, then fixes imports and indentation, preserving hand-aligned layouts.
  The modernisations go first so that imports and indentation are judged on the final text.
recipeList:
  - io.openliberty.yoko.rewrite.YokoForEach
  - io.openliberty.yoko.rewrite.YokoSwitch
  - io.openliberty.yoko.rewrite.YokoImports
  - io.openliberty.yoko.rewrite.YokoIndent
