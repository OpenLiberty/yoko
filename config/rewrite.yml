---
type: specs.openrewrite.org/v1beta/recipe
name: yoko.format.FixIndentation
displayName: Fix Yoko indentation
description: Format tabs and indents to use spaces with 4-space indentation and 8-space tab stops
recipeList:
  - org.openrewrite.java.format.TabsAndIndents:
      useTabCharacter: false
      tabSize: 8
      indentSize: 4
      continuationIndent: 8
