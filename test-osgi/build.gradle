repositories {
    mavenCentral()
}

apply plugin: "biz.aQute.bnd.builder"

dependencies {
  implementation "org.hamcrest:hamcrest:2.1"
  implementation "org.junit.jupiter:junit-jupiter:5.9.0"
  implementation project(":yoko-spec-corba")
  implementation files(project(":yoko-spec-corba").sourceSets.main.output)
  implementation project(":testify")
  implementation project(":testify-iiop")
  runtimeOnly project(":yoko-spec-corba")
  runtimeOnly project(":yoko-core")
  runtimeOnly "org.apache.felix:org.apache.felix.framework:7.0.3"
  // Declarative Services runtime, required by yoko-core's DS components
  runtimeOnly "org.apache.felix:org.apache.felix.scr:2.2.18"
  runtimeOnly "org.osgi:org.osgi.service.component:1.5.1"
  runtimeOnly "org.osgi:org.osgi.util.promise:1.3.0"
  runtimeOnly "org.osgi:org.osgi.util.function:1.2.0"
  runtimeOnly "org.osgi:org.osgi.util.tracker:1.5.4"
  runtimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
}

import aQute.bnd.gradle.TestOSGi

task testOSGi(type: TestOSGi) {
  configurations.implementation
  description "OSGi Test ${name}.bndrun"
  group 'test'
  bndrun = file('test.bndrun')
}

test.dependsOn testOSGi
