// Gradle init script that adds the OpenRewrite plugin to ANY checkout of Yoko, so that the formatter
// can be run on old commits that know nothing about it. Used by scripts/yoko-format.sh; not for direct use.
//
// Required project properties (-P):
//   yoko.format.recipeJar  the jar built from build-tools/yoko-rewrite
//   yoko.format.config     the rewrite.yml that defines the yoko.format.* recipes

initscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // The plugin version fixes the rewrite engine version. build-tools/yoko-rewrite must be built against the same one.
        classpath 'org.openrewrite:plugin:6.25.0'
    }
}

// Included builds (such as build-tools/yoko-rewrite in this repo) run this script too, but must be left alone
if (gradle.parent == null) {
    def props = gradle.startParameter.projectProperties
    def recipeJar = props['yoko.format.recipeJar']
    def config = props['yoko.format.config']
    def recipe = props['yoko.format.recipe'] ?: 'yoko.format.All'
    if (!recipeJar || !config) throw new GradleException('yoko.format.recipeJar and yoko.format.config must be set')

    rootProject {
        // A checkout that already has OpenRewrite set up (such as one at or after the commit that added the formatter) is left to use its own set-up
        if (buildFile.text =~ /org\.openrewrite\.rewrite/) {
            logger.lifecycle('Using the OpenRewrite configuration of this checkout')
            return
        }
        apply plugin: org.openrewrite.gradle.RewritePlugin

        repositories {
            mavenCentral()
        }

        dependencies {
            rewrite files(recipeJar)
        }

        rewrite {
            activeRecipe(recipe)
            configFile = file(config)
            exclusion('worktrees/**')
            exclusion('**/generated-sources/**')
            exclusion('**/java-generated/**')
            exclusion('build-tools/**')
        }
    }
}
