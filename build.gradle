import groovy.time.TimeCategory
import groovy.time.TimeDuration

import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'biz.aQute.bnd:biz.aQute.bnd.gradle:4.1.0'
  }
}

plugins {
  id "biz.aQute.bnd.builder" version "6.4.0" apply false
  id "com.dorongold.task-tree" version "2.1.1"
  id "base"
}

ext {
  testCount = 0
  successfulTestCount = 0
  failedTestCount = 0
  skippedTestCount = 0
  time = new TimeDuration(0,0,0,0)
  testsResults = []
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}

// Validate that .sdkmanrc Gradle version matches wrapper version
def validateGradleVersions() {
    def sdkmanrcFile = file('.sdkmanrc')
    def wrapperPropsFile = file('gradle/wrapper/gradle-wrapper.properties')

    if (!sdkmanrcFile.exists()) {
        logger.warn("Warning: .sdkmanrc file not found")
        return
    }

    if (!wrapperPropsFile.exists()) {
        throw new GradleException("gradle-wrapper.properties not found")
    }

    // Parse .sdkmanrc for gradle version
    def sdkmanrcVersion = null
    sdkmanrcFile.eachLine { line ->
        if (line.trim().startsWith('gradle=')) {
            sdkmanrcVersion = line.split('=')[1].trim()
        }
    }

    // Parse wrapper properties for gradle version
    def wrapperVersion = null
    wrapperPropsFile.eachLine { line ->
        if (line.trim().startsWith('distributionUrl=')) {
            def matcher = (line =~ /gradle-(\d+\.\d+(?:\.\d+)?)-/)
            if (matcher.find()) {
                wrapperVersion = matcher.group(1)
            }
        }
    }

    if (sdkmanrcVersion && wrapperVersion) {
        if (sdkmanrcVersion != wrapperVersion) {
            throw new GradleException(
                "Gradle version mismatch!\n" +
                "  .sdkmanrc:                    gradle=${sdkmanrcVersion}\n" +
                "  gradle-wrapper.properties:    gradle-${wrapperVersion}\n" +
                "Please update both files to use the same Gradle version."
            )
        }
        logger.quiet("✓ Gradle version validated: ${wrapperVersion}")
    }
}

// Run validation during configuration phase
validateGradleVersions()

// Apply interop testing tasks
apply from: 'config/gradle/interop-testing.gradle'

// Apply release configuration
apply from: 'config/gradle/build-release.gradle'

// compute git hash

import static java.time.format.DateTimeFormatter.BASIC_ISO_DATE
import static java.time.format.DateTimeFormatter.ISO_OFFSET_DATE_TIME

def gitHash = 'git rev-parse HEAD'.execute().text.trim()
def gitDirty = !'git status --porcelain'.execute().text.trim().isEmpty()
// compute git commit date
def gitIsoDate = 'git log -1 --date=iso-strict --pretty=format:%cd'.execute().text.trim()
// convert from author's time zone to UTC
def gitIsoDateUtc = Instant.from(ISO_OFFSET_DATE_TIME.parse(gitIsoDate)).atZone(ZoneOffset.UTC)
def gitBasicDateUtc = BASIC_ISO_DATE.format(gitIsoDateUtc)
// Although SemVer2.0 prescribes '+' and '-' separators after major.minor.patch
// OSGi mandates major.minor.patch.qualifier
// OSGi permits '-' and '_' within the qualifier, but not at either end
// OSGi permits no other punctuation or whitespace

// Version detection: use the semantic version tag on HEAD, or fall back to "dev".
def baseVersion
try {
    def tagsOutput = 'git tag --points-at HEAD'.execute().text.trim()

    if (tagsOutput) {
        def versionPattern = /^v?(\d+\.\d+\.\d+)$/
        def versionTags = tagsOutput.split('\n')
            .findAll { it =~ versionPattern }
            .collect { tag ->
                def matcher = tag =~ versionPattern
                matcher.matches() ? matcher.group(1) : null
            }
            .findAll { it != null }

        if (!versionTags.isEmpty()) {
            if (versionTags.size() > 1) {
                throw new GradleException(
                    "Multiple version tags found on HEAD: ${versionTags.join(', ')}\n" +
                    "Remove the extra tags and re-run."
                )
            }
            baseVersion = versionTags[0]
            logger.quiet("Using version from git tag on HEAD: ${baseVersion}")
        } else {
            baseVersion = 'dev'
            logger.quiet("No version tag on HEAD, using: ${baseVersion}")
        }
    } else {
        baseVersion = 'dev'
        logger.quiet("No git tags on HEAD, using: ${baseVersion}")
    }
} catch (GradleException e) {
    throw e
} catch (Exception e) {
    baseVersion = 'dev'
    logger.warn("Failed to read git tags (${e.message}), using: ${baseVersion}")
}

ext.baseVersion = baseVersion

def yokoVersion = (baseVersion == 'dev')
    ? "0.0.0.dev_${gitBasicDateUtc.take(8)}_${gitHash.take(10)}${gitDirty ? '_dirty' : ''}"
    : "${baseVersion}.${gitBasicDateUtc.take(8)}_${gitHash.take(10)}${gitDirty ? '_dirty' : ''}"

// set system properties for use in bundle metadata
System.setProperty("git.hash", gitHash);
System.setProperty("git.date", gitIsoDateUtc.toString());

task getVersion {
  printf "Yoko version = %s%n", yokoVersion
}

// These are the production projects.
// Note the ringer: jdk-supplement is an unshipped prereq to allow compiling for Java 8 and running with Java 11.
def productionProjectPaths = [':jdk-supplement', ':yoko-osgi', ':yoko-spec-corba', ':yoko-rmi-spec', ':yoko-util', ':yoko-rmi-impl', ':yoko-core']

/* Standard configuration for each subproject */
subprojects { sp ->
  apply plugin: 'java-library'

  // Production projects MUST compile for Java 8
  // Test projects are now Java 11 and up only.
  sourceCompatibility = targetCompatibility = productionProjectPaths.contains(sp.path) ? 1.8 : 11

  // Use Java 11 for all unit test compilation too
  tasks.withType(JavaCompile).configureEach {if (name.toLowerCase().contains('test')) sourceCompatibility = targetCompatibility = 11 }

  repositories {
    mavenLocal()
    mavenCentral()
  }

  configurations {
    // declare a test library configuration
    testLib
    testImplementation.extendsFrom testLib
  }

  // additional configuration for projects that have bnd.bnd files
  if (sp.file("bnd.bnd").exists()) {
    apply plugin: 'biz.aQute.bnd.builder'

    // to extend the project with a new property, use project.ext.<new property name>
    project.ext.symbolicName = project.name.replaceFirst("^yoko-", symbolicNamePrefix)
    version = yokoVersion
  }

  // standardise the test deps here
  dependencies {
    testLib 'junit:junit:4.12'
    testLib 'org.mockito:mockito-core:5.18.0'
    testLib 'org.mockito:mockito-junit-jupiter:5.18.0'
    testLib "org.hamcrest:hamcrest:2.1"
    testLib "org.junit.jupiter:junit-jupiter:5.9.0"
    testLib "org.junit.platform:junit-platform-runner:1.8.2"
    testLib "org.junit-pioneer:junit-pioneer:1.9.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.0"
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine:5.9.0"
  }

  if (JavaVersion.current() < JavaVersion.VERSION_11) {
    throw new GradleException("This build must be run with java 11 or higher")
  }

  // ensure tests run under $buildDir somewhere
  tasks.withType(Test).configureEach {
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens=java.rmi/java.rmi=ALL-UNNAMED'
    useJUnitPlatform {
      // Support excluding tags via system property (e.g., -Dtest.excludeTags=interop)
      def tagsToExclude = System.getProperty('test.excludeTags')
      if (tagsToExclude) {
        tagsToExclude.split(',').each { tag ->
          excludeTags tag.trim()
        }
      }
    }
    workingDir = "$buildDir/testWorkingDir"
    doFirst {workingDir.mkdirs()}

    testLogging {
      // set options for log level LIFECYCLE
      events "skipped", "failed", "passed", "standardOut"
      showExceptions true
      exceptionFormat "full"
      showCauses true
      showStackTraces true

      // set options for log level DEBUG and INFO
      debug {
        events "skipped", "failed", "started", "passed", "standardOut", "standardError"
        exceptionFormat "full"
      }
      info.events = debug.events
      info.exceptionFormat = debug.exceptionFormat
      ignoreFailures = true // Always try to run all tests for all modules

      afterTest { desc, result ->
        def totalTime = result.endTime - result.startTime
        println """"Test elapsed time","$desc.name",$totalTime"""
      }

      afterSuite { desc, result ->
        if (!desc.parent) { // will match the outermost suite
          def timeTaken = TimeCategory.minus(new Date(result.endTime), new Date(result.startTime))
          String summary = "${desc.name}" +
                  "\n" +
                  "Results: ${result.resultType} " +
                  "(" +
                  "${result.testCount} tests, " +
                  "${result.successfulTestCount} successes, " +
                  "${result.failedTestCount} failures, " +
                  "${result.skippedTestCount} skipped" +
                  ") " +
                  "in ${timeTaken}" +
                  "\n"
          rootProject.testCount += result.testCount
          rootProject.successfulTestCount += result.successfulTestCount
          rootProject.failedTestCount += result.failedTestCount
          rootProject.skippedTestCount += result.skippedTestCount
          rootProject.time += timeTaken

          // Add reports in `testsResults`, keep failed suites at the end
          if (result.resultType == TestResult.ResultType.SUCCESS) {
            rootProject.testsResults.add(0, summary)
          } else {
            rootProject.testsResults += summary
          }

          def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
          def startItem = '|  ', endItem = '  |'
          def repeatLength = startItem.length() + output.length() + endItem.length()
          println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
        }
        def totalTime = result.endTime - result.startTime
        println """"Suite elapsed time","$desc.name",$totalTime"""
      }
    }

    reports {
      junitXml.required = true
      html.required = true
    }
  }
}

gradle.buildFinished {
  String overallSummary = "Total Summary" +
          "\n" +
          "Results: ${(failedTestCount == 0) ? "SUCCESS": "FAILURE"} " +
          "(" +
          "${rootProject.testCount} tests, " +
          "${rootProject.successfulTestCount} successes, " +
          "${rootProject.failedTestCount} failures, " +
          "${rootProject.skippedTestCount} skipped" +
          ") " +
          "in ${rootProject.time}" +
          "\n"
  rootProject.testsResults.add(overallSummary)

  def allResults = rootProject.testsResults
  if (!allResults.isEmpty()) {
    printResults rootProject.testsResults
  }
}

private void printResults(allResults) {
  if (logger.isQuietEnabled()) return
  // Max line length has to take lines from all items into account
  def maxLength = allResults*.readLines().flatten().collect { it.length() }.max()

  println "\n  \n Build Summary:"
  println ",${"${"-" * maxLength}"}." // Top border

  println allResults.collect {
    it.readLines().collect { // Add left and right border to each _line_
      "|" + it + " " * (maxLength - it.length()) + "|"
    }.join("\n")
  }.join("\n+${"${"-" * maxLength}"}+\n") // Add separator between entries

  println "`${"${"-" * maxLength}"}'" // Print bottom border
}

/* Standard configuration for subprojects with shippable outputs */
configure([
  project(':yoko-osgi'),
  project(':yoko-util'),
  project(':yoko-spec-corba'),
  project(':yoko-rmi-spec'),
  project(':yoko-rmi-impl'),
  project(':yoko-core'),
  project(':testify'),
]) {
  apply plugin: 'maven-publish'
  publishing {
    publications {
      maven(MavenPublication) {
        artifact jar

        pom.withXml {
          def rootNode = asNode()

          // // specify packaging type as bundle (default is pom)
          // def packaging = root.packaging[0] ?:
          //                 root.appendNode('packaging')
          // packaging.setValue('bundle')

          def depsNode = rootNode.dependencies[0] ?:
                  rootNode.appendNode('dependencies')

          // declare compile scope dependencies in the pom.xml
          // as compile dependencies
          configurations.implementation.allDependencies.each {
            def depNode = depsNode.appendNode('dependency')
            depNode.appendNode('groupId', it.group)
            depNode.appendNode('artifactId', it.name)
            depNode.appendNode('version', it.version)
            depNode.appendNode('scope', 'compile')
          }
        }
      }
    }
  }

  jar {
    dependsOn "generatePomFileForMavenPublication"
    // generate the maven dependency metadata
    into("/META-INF/maven/$project.group/$project.name") {
      from 'build/publications/maven'
      rename "pom-default.xml", "pom.xml"
    }
  }

  publish.dependsOn build
  // generated tasks need to be expressed as strings
  // because they don't exist yet when these lines are executed
  publish.dependsOn "publishMavenPublicationToMavenLocal"
  publish.dependsOn "publishToMavenLocal"
}

/**
 * Print a one-line-per-module summary of all JUnit XML results found on disk.
 * Results pre-dating the compiled test classes (or production jars, for integration
 * modules) are flagged [STALE].  Fails the build if any non-stale failures are found.
 *
 * Run standalone:  ./gradlew testSummary
 * Wired automatically as a finalizer of the top-level :build task.
 */
task testSummary {
  description = 'Summarise test results on disk; fails the build if any (non-stale) tests failed'
  group = 'verification'

  doLast {
    def failures = printTestSummary(project)
    if (failures > 0) {
      throw new GradleException("${failures} test(s) failed — see FAILING TESTS above")
    }
  }
}

// Run testSummary automatically after every top-level build
build.finalizedBy testSummary

/**
 * Show a time-distribution analysis across all individual test cases on disk.
 *
 * Lists every test that ran more than 2 standard deviations above the mean.
 *
 * Run standalone:  ./gradlew testTimes
 */
task testTimes {
  description = 'Show test-time distribution and list tests > 2 std devs above the mean'
  group = 'verification'

  doLast {
    printTestTimes(project)
  }
}

private void printTestTimes(project) {
  // Collect every individual testcase time across all modules
  def cases = []
  project.rootProject.subprojects.each { sp ->
    def resultsDir = new File(sp.buildDir, 'test-results')
    if (!resultsDir.exists()) return
    sp.fileTree(resultsDir) { include '**/TEST-*.xml' }.each { xmlFile ->
      def xml = new XmlSlurper().parse(xmlFile)
      xml.testcase.each { tc ->
        def t = tc.@time.text()
        if (!t) return
        cases << [
          module : sp.name,
          clazz  : tc.@classname.text(),
          name   : tc.@name.text(),
          timeSec: t.toDouble(),
        ]
      }
    }
  }

  if (cases.isEmpty()) {
    project.logger.quiet('\nNo test results found on disk.')
    return
  }

  int n = cases.size()
  double mean = cases*.timeSec.sum() / n
  double variance = cases*.timeSec.collect { (it - mean) ** 2 }.sum() / n
  double sd = Math.sqrt(variance)
  double threshold = mean + 2 * sd

  def outliers = cases.findAll { it.timeSec > threshold }.sort { -it.timeSec }

  def sb = new StringBuilder()
  sb << '\n'
  sb << '\n  Test Time Analysis\n'
  sb << sprintf("  %d tests  |  mean %.4fs  |  sd %.4fs  |  threshold (mean + 2sd) %.3fs\n",
      n, mean, sd, threshold)

  if (outliers.isEmpty()) {
    sb << '\n  No tests exceeded the threshold.\n'
  } else {
    sb << sprintf("\n  %d test(s) more than 2 std devs above the mean:\n", outliers.size())

    int wModule = Math.max('Module'.length(), outliers*.module.collect { it.length() }.max())
    int wClass  = Math.max('Class'.length(),  outliers*.clazz .collect { it.length() }.max())
    int wName   = Math.max('Test'.length(),   outliers*.name  .collect { it.length() }.max())

    def sep = '-' * (wModule + wClass + wName + 18)
    def fmt = "  %-${wModule}s  %-${wClass}s  %-${wName}s  %8s"

    sb << "  ${sep}\n"
    sb << sprintf(fmt, 'Module', 'Class', 'Test', 'Time(s)') << '\n'
    sb << "  ${sep}\n"
    outliers.each { c ->
      sb << sprintf(fmt, c.module, c.clazz, c.name, String.format('%.3f', c.timeSec)) << '\n'
    }
    sb << "  ${sep}\n"
  }

  project.logger.quiet(sb.toString())
}

private int printTestSummary(project) {
  def rp = project.rootProject

  // Newest mtime across all production jars — used as an additional staleness anchor
  // for integration-test modules that run against the shipped artifacts.
  // Keep this list in sync with productionProjectPaths defined near the top of the file.
  def integrationTestProjects = [':yoko-verify', ':test-osgi'] as Set
  def productionPaths = [':jdk-supplement', ':yoko-osgi', ':yoko-spec-corba', ':yoko-rmi-spec', ':yoko-util', ':yoko-rmi-impl', ':yoko-core']
  def newestProductionJarMs = -1L
  productionPaths.each { path ->
    def prod = rp.findProject(path)
    if (prod == null) return
    prod.fileTree(new File(prod.buildDir, 'libs')) { include '*.jar'; exclude '*-sources.jar'; exclude '*-javadoc.jar' }.each { f ->
      if (f.lastModified() > newestProductionJarMs) newestProductionJarMs = f.lastModified()
    }
  }

  // Collect one row per testsuite XML file
  def rows = []
  rp.subprojects.each { sp ->
    def resultsDir = new File(sp.buildDir, 'test-results')
    if (!resultsDir.exists()) return

    // Compute the staleness anchor for this subproject: the newest mtime among all
    // compiled artefacts that the tests depend on.
    //
    // test-osgi has no separate test sourceSet — it compiles into classes/java/main.
    // All other modules use classes/java/test for their test classes.
    //
    // For every module we also include classes/java/main (the module's own production
    // code), so that a change to production code that hasn't been re-tested yet is
    // correctly detected as stale even if the test classes themselves are up to date.
    //
    // For integration-test modules (yoko-verify, test-osgi) we additionally require
    // results to post-date the production jars of all production projects.
    def classDirs = (sp.path == ':test-osgi')
        ? ['classes/java/main']
        : ['classes/java/test', 'classes/java/main']

    def newestClassMs = -1L
    classDirs.each { subdir ->
      def dir = new File(sp.buildDir, subdir)
      if (!dir.exists()) return
      sp.fileTree(dir) { include '**/*.class' }.each { f ->
        if (f.lastModified() > newestClassMs) newestClassMs = f.lastModified()
      }
    }
    if (newestClassMs < 0) {
      throw new GradleException(
          "No compiled classes found for ${sp.name} (checked ${classDirs.collect { new File(sp.buildDir, it) }.join(', ')}).\n" +
          "Run the tests before invoking testSummary, or run 'gradle ${sp.path}:test'.")
    }

    // For integration-test modules also require results to post-date the production jars.
    def anchorMs = newestClassMs
    if (integrationTestProjects.contains(sp.path) && newestProductionJarMs > anchorMs) {
      anchorMs = newestProductionJarMs
    }

    // The XML timestamp is truncated to whole seconds; anchorMs is milliseconds.
    // Floor the anchor to the second boundary so a suite that started in the same
    // second as the newest class file is not incorrectly reported as stale.
    def anchorSec = (anchorMs / 1000L) as long

    sp.fileTree(resultsDir) { include '**/TEST-*.xml' }.each { xmlFile ->
      def xml = new XmlSlurper().parse(xmlFile)
      def ts        = xml.@tests.text().toInteger()
      def failures  = xml.@failures.text().toInteger()
      def errors    = xml.@errors.text().toInteger()
      def skipped   = xml.@skipped.text().toInteger()
      def passed    = ts - failures - errors - skipped
      def timeVal   = xml.@time.text()
      def suiteName = xml.@name.text()
      def timestamp = xml.@timestamp.text()   // e.g. "2026-11-02T14:53:09"

      // A result is stale when it pre-dates the anchor timestamp.
      // A missing or unparseable timestamp is a broken XML file — fail loudly.
      if (!timestamp) {
        throw new GradleException(
            "Missing timestamp attribute in ${xmlFile.name} (${sp.name}).\n" +
            "The file may be corrupt. Delete ${sp.buildDir}/test-results and re-run tests.")
      }
      def stale
      try {
        def fmt = DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ss")
        def suiteEpochSec = java.time.LocalDateTime.parse(timestamp, fmt)
            .atZone(ZoneOffset.UTC).toEpochSecond()
        stale = suiteEpochSec < anchorSec
      } catch (Exception e) {
        throw new GradleException(
            "Unparseable timestamp '${timestamp}' in ${xmlFile.name} (${sp.name}): ${e.message}\n" +
            "Expected format: yyyy-MM-ddTHH:mm:ss")
      }

      // Collect individual failing test names from this suite
      def failingTests = []
      if (failures + errors > 0) {
        xml.testcase.each { tc ->
          if (tc.failure.size() > 0 || tc.error.size() > 0) {
            failingTests << "${tc.@classname.text()}.${tc.@name.text()}"
          }
        }
      }

      rows << [
        module      : sp.name,
        tests       : ts,
        passed      : passed,
        failures    : failures + errors,
        skipped     : skipped,
        timeSec     : timeVal.toDouble(),
        stale       : stale,
        failingTests: failingTests,
      ]
    }
  }

  if (rows.isEmpty()) {
    project.logger.quiet('\nNo test results found on disk.')
    return 0
  }

  // Aggregate to one row per module
  def byModule = [:]
  rows.each { r ->
    def m = byModule.computeIfAbsent(r.module) { [
      module          : r.module,
      tests           : 0,
      passed          : 0,
      failures        : 0,
      skipped         : 0,
      timeSec         : 0.0,
      stale           : false,
      failingTests    : [],      // non-stale failures
      staleFailingTests: [],     // stale failures
    ]}
    m.tests    += r.tests
    m.passed   += r.passed
    m.failures += r.failures
    m.skipped  += r.skipped
    m.timeSec  += r.timeSec
    if (r.stale) {
      m.stale = true
      m.staleFailingTests.addAll(r.failingTests)
    } else {
      m.failingTests.addAll(r.failingTests)
    }
  }

  // Sort: stale last, then by module name
  def modules = byModule.values().sort { a, b ->
    if (a.stale != b.stale) return a.stale ? 1 : -1
    a.module <=> b.module
  }

  // Column widths
  int wModule  = Math.max('Module'.length(),  modules*.module.collect { it.length() }.max())
  int wTests   = Math.max('Tests'.length(),   modules*.tests   .collect { it.toString().length() }.max())
  int wPassed  = Math.max('Passed'.length(),  modules*.passed  .collect { it.toString().length() }.max())
  int wFailed  = Math.max('Failed'.length(),  modules*.failures.collect { it.toString().length() }.max())
  int wSkipped = Math.max('Skipped'.length(), modules*.skipped .collect { it.toString().length() }.max())

  def sep = '-' * (wModule + wTests + wPassed + wFailed + wSkipped + 24)
  def fmt = "  %-${wModule}s  %${wTests}s  %${wPassed}s  %${wFailed}s  %${wSkipped}s  %8s  %s"

  def sb = new StringBuilder()
  sb << '\n'
  sb << '\n  Test Summary\n'
  sb << "  ${sep}\n"
  sb << sprintf(fmt, 'Module', 'Tests', 'Passed', 'Failed', 'Skipped', 'Time(s)', '') << '\n'
  sb << "  ${sep}\n"

  int totTests = 0, totPassed = 0, totFailed = 0, totSkipped = 0
  double totTime = 0.0
  modules.each { m ->
    def tag = m.stale ? '[STALE]' : ''
    def timeStr = String.format('%.3f', m.timeSec)
    sb << sprintf(fmt, m.module, m.tests, m.passed, m.failures, m.skipped, timeStr, tag) << '\n'
    totTests   += m.tests
    totPassed  += m.passed
    totFailed  += m.failures
    totSkipped += m.skipped
    totTime    += m.timeSec
  }

  sb << "  ${sep}\n"
  sb << sprintf(fmt, 'TOTAL', totTests, totPassed, totFailed, totSkipped, String.format('%.3f', totTime), '') << '\n'
  sb << "  ${sep}\n"

  // Non-stale failures — these will fail the build
  def freshFailing = modules.collectMany { m -> m.failingTests.collect { t -> "${m.module} > ${t}" } }
  // Stale failures — informational only
  def staleFailing = modules.collectMany { m -> m.staleFailingTests.collect { t -> "${m.module} > ${t}" } }

  if (freshFailing || staleFailing) {
    sb << '\n  FAILING TESTS:\n'
    freshFailing.each { sb << "    ${it}\n" }
    staleFailing.each { sb << "    ${it} [STALE]\n" }
  }

  project.logger.quiet(sb.toString())
  return freshFailing.size()
}


task testReport (type: TestReport) {
    // GitHub artifact uploader won't upload anything in the root project. Not sure why.
    // Generate the aggregate report into a subproject
    destinationDir = file("${buildDir}/reports/allTests")
    def projectsWithResults = subprojects.findAll { subproject ->
        def testResultsDir = new File(subproject.buildDir, "test-results")
        if (!testResultsDir.exists()) return false
        def xmlFiles = subproject.fileTree(testResultsDir).include("**/*.xml")
        return !xmlFiles.empty
    }
    def projectsWithTests = subprojects.findAll { it.tasks.findByName('test') != null }
    testResults.from = projectsWithResults.test
}


task createBuildLibSymlinks {
    description = 'Creates symbolic links to jar files in the build/lib directory'
    group = 'build'

    def targetProjects = [
        ':yoko-core',
        ':yoko-spec-corba',
        ':yoko-rmi-impl',
        ':yoko-rmi-spec',
        ':yoko-util',
        ':yoko-osgi'
    ]

    // Depend on jar tasks of all target projects
    targetProjects.each { projectPath ->
        dependsOn "${projectPath}:jar"
    }

    // Register output directory so gradle clean removes it
    outputs.dir("${buildDir}/lib")

    doLast {
        def libDir = file("${buildDir}/lib")
        def depsDir = file("${buildDir}/lib/deps")

        // Create directories if they don't exist
        if (!depsDir.exists()) {
            depsDir.mkdirs()
            println "Created directory: ${depsDir}"
        }

        // Clean out existing symbolic links and regular files in lib
        libDir.listFiles().each { file ->
            if (file.isFile() || (java.nio.file.Files.isSymbolicLink(file.toPath()) && file.name.endsWith('.jar'))) {
                file.delete()
                println "Removed existing file: ${file.name}"
            }
        }

        // Clean out deps directory
        if (depsDir.exists()) {
            depsDir.listFiles().each { file ->
                file.delete()
            }
        }

        // Create symbolic links for each project's jar
        targetProjects.each { projectPath ->
            def subproject = project(projectPath)
            def jarTask = subproject.tasks.jar
            def jarFile = jarTask.archiveFile.get().asFile

            if (jarFile.exists()) {
                // Use simple name without version info
                def projectName = subproject.name
                def linkFile = new File(libDir, "${projectName}.jar")

                // Create symbolic link using relative path
                def relativePath = libDir.toPath().relativize(jarFile.toPath())
                java.nio.file.Files.createSymbolicLink(
                    linkFile.toPath(),
                    relativePath
                )
                println "Created symlink: ${linkFile.name} -> ${relativePath}"
            } else {
                println "Warning: JAR file not found: ${jarFile}"
            }
        }

        // Copy external dependencies from yoko-core runtime classpath to deps/
        def coreProject = project(':yoko-core')
        def runtimeClasspath = coreProject.configurations.runtimeClasspath
        def externalDeps = runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            // Only include external dependencies (not project dependencies)
            artifact.moduleVersion.id.group != project.group
        }

        externalDeps.each { artifact ->
            def sourceFile = artifact.file
            def targetFile = new File(depsDir, sourceFile.name)

            // Copy the file to deps/ directory
            java.nio.file.Files.copy(
                sourceFile.toPath(),
                targetFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            println "Copied dependency: ${sourceFile.name} -> deps/"

            // Create version-free symlink in lib/ pointing to deps/
            def baseName = sourceFile.name.replaceAll(/-\d+(\.\d+)*(-[^.]+)?\.jar$/, '.jar')
            def symlinkFile = new File(libDir, baseName)
            def symlinkTarget = libDir.toPath().relativize(targetFile.toPath())

            java.nio.file.Files.createSymbolicLink(
                symlinkFile.toPath(),
                symlinkTarget
            )
            println "Created symlink: ${baseName} -> ${symlinkTarget}"
        }
    }
}

// Make createBuildLibSymlinks run at the end of build
build.finalizedBy createBuildLibSymlinks
